<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Form</title>
</head>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #f8fafc);
    padding: 30px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    color: #1d4ed8;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

h2 {
    color: #1e3a8a;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 8px;
    margin-top: 25px;
}

.form-group {
    margin: 18px 0;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 7px;
}

input[type="text"],
input[type="email"],
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #2563eb;
}

.question {
    background: #f8fafc;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
}

.question p {
    font-weight: bold;
    margin-top: 0;
}

.option {
    margin: 12px 0;
}

.option label {
    display: inline;
    font-weight: normal;
    margin-left: 8px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #1d4ed8;
}


.required {
    color: red;
}
</style>
<body>
  <h1>Quiz Form</h1>
  <form>
    <label for="question1">Name</label>
    <input type="text" id="question1" name="question1">
    <br><br>
    <label for="question2">Roll Number</label>
    <input type="text" id="question2" name="question2">
    <br><br>
    <label for="question3">Section</label>
    <input type="text" id="question3" name="question3">
    <br><br>
    <label for="question4">Year</label>
    <input type="text" id="question4" name="question4">
    <br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form action="#">
        <div class="input-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="input-group">
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date" required>
        </div>

        <div class="input-group">
            <fieldset>
                <legend>Gender</legend>
                <div class="gender">
                    <label for="male"><input type="radio" name="gender" id="male"> Male</label>
                    <label for="female"><input type="radio" name="gender" id="female"> Female</label>
                    <label for="other"><input type="radio" name="gender" id="other"> Other</label>
                </div>
            </fieldset>
        </div>

        <div class="input-group">
            <label for="course">Course</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>B.Sc</option>
                <option>B.Com</option>
                <option>B.Tech</option>
                <option>MCA</option>
            </select>
        </div>

        <div class="input-group">
            <label for="address">Address</label>
            <textarea id="address" rows="4" placeholder="Enter your address"></textarea>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
